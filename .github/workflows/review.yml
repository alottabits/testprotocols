name: Review

# The gate and the dispatch (CONTRIBUTING.md, "A PR's life", step 3). A
# maintainer comments `/review` (or `/review full`, a full re-review) on a PR; this job checks that the commenter
# is listed in MAINTAINERS.md on `main` and has write access, that the PR is
# not a draft and that `dco`, `lint` and `hygiene` are green on the head
# commit, sets the `review` status to pending and sends a repository_dispatch
# to the private runner, which reviews and posts back under the App's
# identity — or, when no reviewer takes the PR's kind, refuses instead so
# hygiene's own `review` status stands. No agent runs here and no model key
# exists here: this log shows a gate decision and a dispatch, nothing else.
# `issue_comment` runs in the base repository from `main`, so a PR from a
# fork is dispatched exactly as a branch PR once a maintainer types the
# command.
# For a fork PR that changes package source it also dispatches the
# `conformance` check to the private reference corpus (CONTRIBUTING.md, The
# conformance check): the maintainer has read the diff by then.
#
# A **status refresh** (CONTRIBUTING.md, "A PR's life", step 4) runs the same
# gate without a comment: when a maintainer pushes to a branch PR whose
# previous head carries an approve or approve-with-conditions `review`
# status, the push is the fold-back of that review's conditions, and the
# runner re-reviews the delta against them (`refresh: true`). A fork PR, a
# push by a non-maintainer, a draft, or a previous head without such a
# verdict gets no refresh and no comment; `/review` stays available.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write   # the refusal comment
  statuses: write        # review=pending

jobs:
  gate:
    if: >-
      ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
          || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}
      COMMENTER: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.sender.login }}
      REFRESH: ${{ github.event_name == 'pull_request' }}
      BEFORE_SHA: ${{ github.event.before }}
      RUNNER_REPO: alottabits/testprotocols-review-runner
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for the deterministic gates on a pushed head (status refresh)
        # The push that starts a refresh also starts dco, lint and hygiene; the
        # gate below needs their conclusions. Up to five minutes, then the gate
        # refuses with the run that is still pending.
        if: ${{ env.REFRESH == 'true' }}
        run: |
          set -euo pipefail
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          for _ in $(seq 1 20); do
            pending=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100"               --jq '[.check_runs[] | select(.name == "dco" or .name == "lint" or .name == "hygiene") | select(.status != "completed")] | length'               | jq -s 'add // 0')
            names=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100"               --jq '[.check_runs[] | select(.name == "dco" or .name == "lint" or .name == "hygiene") | .name] | unique | length'               | jq -s 'add // 0')
            if [ "$pending" = 0 ] && [ "$names" -ge 3 ]; then break; fi
            sleep 15
          done

      - name: Read the PR, the requester's access and the head checks through the API
        run: |
          set -euo pipefail
          mkdir -p review-work
          if [ "$REFRESH" = true ]; then
            printf '/review\n' > review-work/body.txt
            gh api --paginate "repos/$REPO/commits/$BEFORE_SHA/statuses?per_page=100" \
              | jq -s 'add // []' > review-work/before-statuses.txt
          else
            gh api "repos/$REPO/issues/comments/${{ github.event.comment.id }}" --jq .body > review-work/body.txt
          fi
          gh api "repos/$REPO/pulls/$PR" > review-work/pr.json
          gh api --paginate "repos/$REPO/pulls/$PR/files" | jq -s 'add // []' > review-work/files.json
          gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission > review-work/permission.txt
          HEAD_SHA=$(jq -r .head.sha review-work/pr.json)
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "HEAD_REF=$(jq -r .head.ref review-work/pr.json)" >> "$GITHUB_ENV"
          echo "HEAD_REPO=$(jq -r .head.repo.full_name review-work/pr.json)" >> "$GITHUB_ENV"
          # Every check run on the head commit, not one per name: a cancelled
          # run and the later run that superseded it share a name, and the
          # gate picks between them (scripts/review_gate.py, conclusions).
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | {id, name, status, conclusion}]' \
            | jq -s 'add // []' > review-work/checks.json

      - name: Gate
        id: gate
        run: |
          set -euo pipefail
          refresh_args=()
          if [ "$REFRESH" = true ]; then refresh_args=(--refresh-statuses review-work/before-statuses.txt); fi
          if python scripts/review_gate.py \
               --body review-work/body.txt --commenter "$COMMENTER" \
               --permission "$(cat review-work/permission.txt)" \
               --maintainers MAINTAINERS.md --pr review-work/pr.json \
               --checks review-work/checks.json --full-out review-work/full.txt \
               "${refresh_args[@]}" > review-work/gate.txt; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
          cat review-work/gate.txt

      - name: No refresh (a push that does not fold back an approve verdict)
        # Not a refusal: nothing was asked. `/review` stays available.
        if: ${{ steps.gate.outputs.allowed != 'true' && env.REFRESH == 'true' }}
        run: |
          echo "no status refresh: $(cat review-work/gate.txt)"
          echo "proceed=false" >> "$GITHUB_ENV"

      - name: Refuse
        if: ${{ steps.gate.outputs.allowed != 'true' && env.REFRESH != 'true' }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" --repo "$REPO" \
            --body "review not started: $(cat review-work/gate.txt) (CONTRIBUTING.md, A PR's life, step 3)"
          exit 1

      - name: Which reviewers
        id: reviewers
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        run: |
          set -euo pipefail
          KIND=$(jq -r .title review-work/pr.json | sed -nE 's/^([a-z]+)!?: .*/\1/p')
          REVIEWERS=$(python scripts/pr_hygiene.py reviewers --pr review-work/pr.json --files review-work/files.json)
          if [ -z "$REVIEWERS" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "review not started: no reviewer takes this PR; hygiene sets its status (CONTRIBUTING.md, A PR's life, step 3)"
            exit 1
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "reviewers=$REVIEWERS" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND reviewers=${REVIEWERS:-none}"

      - name: Set review=pending on the head commit
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context=review -f description="$([ "$REFRESH" = true ] && echo 'status refresh requested' || echo 'review requested')" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mint the dispatch token
        id: app
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          owner: alottabits
          repositories: testprotocols-review-runner
          permission-contents: write
          permission-metadata: read

      - name: Dispatch to the runner
        if: ${{ steps.gate.outputs.allowed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KIND: ${{ steps.reviewers.outputs.kind }}
          REVIEWERS: ${{ steps.reviewers.outputs.reviewers }}
        run: |
          set -euo pipefail
          jq -n --arg repo "$REPO" --argjson pr "$PR" --arg sha "$HEAD_SHA" \
             --arg kind "$KIND" --arg reviewers "$REVIEWERS" --arg ref "$HEAD_REF" \
             --argjson full "$(cat review-work/full.txt)" --argjson refresh "$REFRESH" \
             '{event_type: "review-requested",
               client_payload: {repo: $repo, pr: $pr, sha: $sha, kind: $kind, reviewers: $reviewers, head_ref: $ref, full: $full, refresh: $refresh}}' \
          | gh api -X POST "repos/$RUNNER_REPO/dispatches" --input -
          echo "dispatched pr=$PR sha=$HEAD_SHA kind=$KIND reviewers=$REVIEWERS full=$(cat review-work/full.txt) refresh=$REFRESH"

      - name: Mint the corpus dispatch token (fork PRs with package source)
        id: corpus_app
        if: ${{ steps.gate.outputs.allowed == 'true' && env.HEAD_REPO != github.repository }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          owner: alottabits
          repositories: testprotocols-reference
          permission-contents: write
          permission-metadata: read

      - name: Dispatch conformance for a fork PR (the maintainer has read the diff)
        if: ${{ steps.gate.outputs.allowed == 'true' && env.HEAD_REPO != github.repository }}
        env:
          GH_TOKEN: ${{ steps.corpus_app.outputs.token }}
        run: |
          set -euo pipefail
          if jq -r '.[].filename' review-work/files.json | grep -q '^packages/[^/]*/src/'; then
            jq -n --arg repo "$REPO" --argjson pr "$PR" --arg sha "$HEAD_SHA" --arg ref "$HEAD_REF" \
              '{event_type: "conformance-requested",
                client_payload: {repo: $repo, pr: $pr, sha: $sha, head_ref: $ref}}' \
            | gh api -X POST repos/alottabits/testprotocols-reference/dispatches --input -
            echo "conformance dispatched for fork PR $PR"
          fi

      - name: Mint the status token (a failed fork conformance dispatch)
        id: fork_status
        if: ${{ failure() && env.HEAD_REPO != github.repository && steps.corpus_app.outcome != 'skipped' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          owner: alottabits
          repositories: testprotocols
          permission-statuses: write
          permission-metadata: read

      - name: conformance = error when the fork dispatch failed
        if: ${{ failure() && steps.fork_status.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.fork_status.outputs.token }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=error \
            -f context=conformance -f description="could not dispatch to the reference corpus; see the run" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
